services:
  # Backend Service
  - type: web
    name: wyzer-backend
    env: node
    buildCommand: "chmod +x render-build.sh && ./render-build.sh"
    startCommand: "node backend/server.js"
    workingDirectory: "/opt/render/project"
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: mysql-gnidi.alwaysdata.net
      - key: DB_USER
        value: gnidi
      - key: DB_PASSWORD
        value: medmidou007
      - key: DB_NAME
        value: gnidi_wyzer
      - key: DB_PORT
        value: 3306
      - key: JWT_SECRET
        value: 636fc830f8d08b90cf240dac53caca16

  # Frontend Service (Static Site)
  - type: web
    name: wyzer-frontend
    env: static
    buildCommand: "cd app && npm install && npm run build"
    staticPublishPath: "./app/build"
    envVars:
      - key: REACT_APP_API_URL
        value: https://wyzer-backend.onrender.com
      - key: NODE_VERSION
        value: 18.x
